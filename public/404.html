<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // O site é publicado em https://daviddevlinux.github.io/labdock/.
      // Por isso, o primeiro segmento do caminho (/labdock) é a base do
      // projeto e não pode fazer parte da rota entregue ao React.
      var l = window.location;
      var projectSegments = 1;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + projectSegments).join('/') +
        '/?/' + l.pathname.slice(1).split('/').slice(projectSegments).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
